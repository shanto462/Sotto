<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>Sotto</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../../../node_modules/highlight.js/styles/github-dark.css" />
    <style>
      html, body { height: 100%; overflow: hidden; background: transparent; }
      body { user-select: none; }

      #frame {
        height: 100%;
        background: var(--color-bg-glass);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #strip {
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--color-border);
        flex-shrink: 0;
        font-size: var(--text-xs);
        color: var(--color-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 600;
      }
      #strip .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-accent);
        box-shadow: 0 0 8px rgba(122, 162, 255, 0.6);
      }
      #strip .hint {
        margin-left: auto;
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
        font-size: 10.5px;
        opacity: 0.65;
      }

      #content {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px 12px;
        scroll-behavior: smooth;
      }
      #content::-webkit-scrollbar { width: 6px; }

      #footer {
        flex-shrink: 0;
        padding: 7px 14px 8px;
        font-size: 10.5px;
        color: var(--color-muted);
        border-top: 1px solid var(--color-border);
        font-feature-settings: "tnum";
      }

      #empty {
        color: var(--color-muted);
        font-size: var(--text-md);
        text-align: center;
        padding: 36px 20px;
        line-height: 1.6;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--color-muted);
        padding: 8px 0;
      }
      .status-error { color: #ff9090; }
      .spinner {
        width: 12px;
        height: 12px;
        border: 2px solid rgba(122, 162, 255, 0.3);
        border-top-color: var(--color-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      /* Markdown */
      .md { overflow-wrap: anywhere; word-break: break-word; }
      .md h1, .md h2, .md h3, .md h4 { font-weight: 600; margin: 18px 0 8px; line-height: 1.3; }
      .md h1 { font-size: 17px; color: #fff; }
      .md h2 { font-size: 15px; color: #fff; }
      .md h3 { font-size: 13px; color: var(--color-text-dim); }
      .md p { margin: 8px 0; }
      .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
      .md li { margin: 4px 0; }
      .md li::marker { color: var(--color-accent); }
      .md a { color: var(--color-accent); border-bottom: 1px dotted; text-decoration: none; }
      .md strong { font-weight: 600; color: #fff; }
      .md em { font-style: italic; }
      .md blockquote {
        border-left: 3px solid var(--color-accent);
        padding: 4px 12px;
        margin: 10px 0;
        color: var(--color-muted);
        font-style: italic;
        background: rgba(122, 162, 255, 0.04);
      }
      .md code {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 1px 5px;
        border-radius: 4px;
        font: 12.5px/1.4 var(--font-mono);
        color: #ffd479;
      }
      .md pre {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 10px 0;
        overflow-x: hidden;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .md pre code {
        background: transparent;
        border: none;
        padding: 0;
        color: inherit;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .md hr { border: none; border-top: 1px solid var(--color-border); margin: 16px 0; }
      .md table { border-collapse: collapse; margin: 10px 0; width: 100%; }
      .md th, .md td { border: 1px solid var(--color-border); padding: 6px 10px; text-align: left; }
      .md th { background: rgba(255, 255, 255, 0.04); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="strip">
        <span class="dot"></span>
        <span>Sotto</span>
        <span class="hint">Ctrl+B hides · hover to scroll</span>
      </div>
      <div id="content">
        <div id="empty">
          Press <kbd>Ctrl+M</kbd> in Chrome to ask Claude.<br />
          Press <kbd>Ctrl+B</kbd> to hide / show this overlay.<br />
          <span style="font-size: 11px; opacity: 0.7;">
            Click-through · scroll on hover · hidden from screen capture
          </span>
        </div>
      </div>
      <div id="footer"></div>
    </div>
    <script src="ui.js"></script>
  </body>
</html>
