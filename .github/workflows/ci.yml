name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Electron binary is not needed to lint or test, and electron-builder
  # downloads its own copy when packaging.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package (${{ matrix.os }})
    needs: lint-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dir
            unpacked: dist/mac-arm64/Sotto.app/Contents/Resources/app.asar.unpacked
          - os: windows-latest
            target: --win dir
            unpacked: dist/win-unpacked/resources/app.asar.unpacked
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Check the extension and license are unpacked
        shell: bash
        run: |
          test -f "${{ matrix.unpacked }}/extension/manifest.json"
          test -f "${{ matrix.unpacked }}/LICENSE"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
