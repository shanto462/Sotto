name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "When I present from a second monitor, the overlay always opens on the main screen."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      placeholder: "Open the overlay on the same display as the active Chrome window."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
